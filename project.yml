name: PrintSplitMac
options:
  bundleIdPrefix: com.nikopietinen
  deploymentTarget:
    macOS: "14.0"
  xcodeVersion: "16.0"
settings:
  base:
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_IDENTITY: "-"
    CODE_SIGN_STYLE: Manual
    SWIFT_VERSION: "5.0"
    ARCHS: "arm64 x86_64"
    ONLY_ACTIVE_ARCH: NO
targets:
  PrintSplitMac:
    type: application
    platform: macOS
    deploymentTarget: "14.0"
    sources:
      - path: PrintSplitMac
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.nikopietinen.printsplitmac
        INFOPLIST_KEY_CFBundleDisplayName: "PrintSplit & Pin"
        GENERATE_INFOPLIST_FILE: YES
        CURRENT_PROJECT_VERSION: "1"
        MARKETING_VERSION: "1.0"
        ENABLE_HARDENED_RUNTIME: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
